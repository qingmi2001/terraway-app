plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '15'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '0.7.0'

android {
    namespace = "com.nmlyzx.gps"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId = "com.nmlyzx.gps"
        minSdk = 21
        targetSdk = 34
        versionCode = 22
        versionName = "0.7.7"
    }

    signingConfigs {
        release {
            storeFile file("upload-keystore.jks")
            storePassword "nmlyzx123456"
            keyAlias "nmlyzx"
            keyPassword "nmlyzx123456"
            // 显式强制启用 V1 (Jar) 与 V2 (Full APK Signature Scheme) 双重签名
            // 彻底解决 vivo / OPPO / 小米 / 华为 等机型报“缺乏开发者证书/软件包无效”问题
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
