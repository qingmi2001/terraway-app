name: terraway_gps
description: "山海行 (TerraWay) - 全地形户外手持 GPS 导航与多点路书系统 (徒步 / 骑行 / 越野穿越)"
publish_to: 'none'
version: 0.7.8+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^12.0.0
  flutter_compass: ^0.8.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3

# 锁定稳定版本，避开 geolocator_android 4.6.2 的 Gradle 缺陷
dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
